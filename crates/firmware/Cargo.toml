[package]
name = "iasis-firmware"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "iasis-firmware"
path = "src/main.rs"
test = false
bench = false

[dependencies]
iasis-protocol.workspace = true
iasis-pd.workspace = true
embedded-graphics = "0.8"
heapless = "0.9"

[target.'cfg(not(target_arch = "arm"))'.dev-dependencies]
ssd1306 = "0.10"
display-interface = "0.5"

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1"
embassy-rp = { version = "0.10", features = [
  "rp235xb",
  "time-driver",
  "critical-section-impl",
  "unstable-pac",
] }
embassy-time = "0.5"
embassy-usb = { version = "0.6", default-features = false }
smart-leds = "0.4"
ssd1306 = { version = "0.10", features = ["async"] }
display-interface = "0.5"
