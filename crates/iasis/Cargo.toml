[package]
name = "iasis"
description = "Host tools for the Iasis restore hub"
homepage = "https://github.com/hydazz/iasis"
default-run = "iasis"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0"
base64 = "0.23"
rpassword = "7"
secrecy = "0.10"
clap = { version = "4.6", features = ["derive"] }
iasis-api.workspace = true
iasis-protocol.workspace = true
iasis-pd.workspace = true
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
keepawake = "0.6.1"
nusb = "0.2.9"
plist = "1.10.3"
serde = { workspace = true, features = ["std"] }
serde_json = "1.0"
tempfile = "3.27.0"
thiserror = "2.0"
zeroize = "1"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ureq = { version = "3", features = ["platform-verifier"] }
sha2 = "0.11.1"
restorekit.workspace = true
futures-core = "0.3"
picoboot = { version = "0.3.0", default-features = false, features = ["smol"] }
pollster = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
io-kit-sys = "0.5"
system-configuration = "0.8"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
nix = { version = "0.32", features = [
  "fs",
  "hostname",
  "net",
  "poll",
  "resource",
  "socket",
  "user",
] }
signal-hook = "0.3"
pcap = "2.5"
pktkit = { version = "=0.1.12", features = ["dhcp", "l2adapter", "slirp"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
restorekit-sys.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
] }

[package.metadata.deb]
maintainer = "hydazz <hydazz@users.noreply.github.com>"
copyright = "hydazz"
license-file = ["../../LICENSE", "0"]
extended-description = "The iasis CLI and the iasisd agent. The console user and members of the iasis group can use the agent."
section = "utils"
depends = "$auto, usbmuxd, systemd | systemd-standalone-sysusers | systemd-sysusers"
recommends = "polkitd"
maintainer-scripts = "debian/"
assets = [
  [
    "target/release/iasis",
    "usr/bin/",
    "755",
  ],
  [
    "target/release/iasisd",
    "usr/libexec/iasis/",
    "755",
  ],
  [
    "target/release/iasis-gateway",
    "usr/libexec/iasis/",
    "755",
  ],
  [
    "debian/70-iasis.rules",
    "usr/lib/udev/rules.d/",
    "644",
  ],
  [
    "debian/com.hydaz.iasis.policy",
    "usr/share/polkit-1/actions/",
    "644",
  ],
  [
    "debian/com.hydaz.iasis.rules",
    "usr/share/polkit-1/rules.d/",
    "644",
  ],
  [
    "NOTICES.txt",
    "usr/share/doc/iasis/",
    "644",
  ],
]
systemd-units = { unit-scripts = "debian/", unit-name = "iasisd" }
