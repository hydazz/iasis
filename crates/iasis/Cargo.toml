[package]
name = "iasis"
default-run = "iasis"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
iasis-protocol.workspace = true
iasis-pd.workspace = true
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
nusb = "0.2.9"
plist = "1.10.3"
serde = { workspace = true, features = ["std"] }
serde_json = "1.0"
tempfile = "3.27.0"
thiserror = "2.0"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ureq = "3"
sha2 = "0.11.1"
directories = "6.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
io-kit-sys = "0.5"
system-configuration = "0.8"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
nix = { version = "0.32", features = ["fs", "net", "poll", "resource"] }
pcap = "2.5"
pktkit = { version = "=0.1.12", features = ["dhcp", "l2adapter", "slirp"] }
restorekit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
restorekit-sys.workspace = true
