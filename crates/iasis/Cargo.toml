[package]
name = "iasis"
description = "Host tools for Iasis, a USB-C hub that puts Apple devices in DFU and restores them"
homepage = "https://github.com/hydazz/iasis"
default-run = "iasis"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
iasis-api.workspace = true
iasis-protocol.workspace = true
iasis-pd.workspace = true
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
nusb = "0.2.9"
plist = "1.10.3"
serde = { workspace = true, features = ["std"] }
serde_json = "1.0"
tempfile = "3.27.0"
thiserror = "2.0"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ureq = "3"
sha2 = "0.11.1"
restorekit.workspace = true
futures-core = "0.3"
picoboot = { version = "0.3.0", default-features = false, features = ["smol"] }
pollster = "0.4"

[target.'cfg(not(target_os = "linux"))'.dependencies]
directories = "6.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
io-kit-sys = "0.5"
system-configuration = "0.8"
wait-timeout = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
nix = { version = "0.32", features = ["fs", "net", "poll", "resource", "socket"] }
pcap = "2.5"
pktkit = { version = "=0.1.12", features = ["dhcp", "l2adapter", "slirp"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
restorekit-sys.workspace = true

[package.metadata.deb]
maintainer = "hydazz <hydazz@users.noreply.github.com>"
copyright = "hydazz"
license-file = ["../../LICENSE", "0"]
extended-description = """\
The iasis command and the iasisd service, which attends every Iasis board, \
restores the Apple devices on their ports and shares this host's internet \
connection with them. Members of the iasis group use the service."""
section = "utils"
depends = "$auto, usbmuxd, systemd | systemd-standalone-sysusers | systemd-sysusers"
maintainer-scripts = "debian/"
assets = [
  [
    "target/release/iasis",
    "usr/bin/",
    "755",
  ],
  [
    "target/release/iasisd",
    "usr/libexec/iasis/",
    "755",
  ],
  [
    "target/release/iasis-gateway",
    "usr/libexec/iasis/",
    "755",
  ],
  [
    "debian/70-iasis.rules",
    "usr/lib/udev/rules.d/",
    "644",
  ],
  [
    "debian/iasis.polkit.rules",
    "usr/share/polkit-1/rules.d/iasis.rules",
    "644",
  ],
  [
    "NOTICES.txt",
    "usr/share/doc/iasis/",
    "644",
  ],
]
systemd-units = { unit-scripts = "debian/", unit-name = "iasisd" }
