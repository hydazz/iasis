[workspace]
members = ["crates/firmware", "crates/protocol", "crates/iasis", "crates/pd"]
default-members = ["crates/protocol", "crates/iasis", "crates/pd"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
iasis-protocol = { path = "crates/protocol" }
iasis-pd = { path = "crates/pd" }
postcard = { version = "1.1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "thin"

[profile.release.package.iasis-firmware]
opt-level = "s"
