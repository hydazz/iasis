[workspace]
members = [
  "crates/firmware",
  "crates/protocol",
  "crates/api",
  "crates/iasis",
  "crates/pd",
  "apps/linux",
]
default-members = ["crates/protocol", "crates/api", "crates/iasis", "crates/pd"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
iasis-api = { path = "crates/api" }
iasis-protocol = { path = "crates/protocol" }
iasis-pd = { path = "crates/pd" }
postcard = { version = "1.1", default-features = false }
restorekit = { version = "=0.7.1", default-features = false }
restorekit-sys = "=0.6.6"
serde = { version = "1.0", default-features = false, features = ["derive"] }

# RestoreKit 0.6.6 with fixes not yet released upstream.
[patch.crates-io]
restorekit = { git = "https://github.com/hydazz/restorekit", rev = "73f349ff9694cb6295e8774049269a9550c76bb5" }
restorekit-sys = { git = "https://github.com/hydazz/restorekit", rev = "73f349ff9694cb6295e8774049269a9550c76bb5" }

[profile.release]
codegen-units = 1
lto = "thin"

[profile.release.package.iasis-firmware]
opt-level = "s"
