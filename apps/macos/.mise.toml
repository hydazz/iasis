[tools]
periphery = "3.8.0"
swiftformat = "0.64.7"

[tasks.format]
run = "swiftformat Iasis IasisTests"

[tasks.fmt-check]
run = "swiftformat Iasis IasisTests --lint"

[tasks.build]
description = "Unsigned"
run = """
xcodebuild build \
  -project Iasis.xcodeproj \
  -scheme Iasis \
  -destination 'generic/platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.periphery]
run = """
periphery scan \
  --project Iasis.xcodeproj \
  --schemes Iasis \
  --format xcode \
  --strict \
  --disable-update-check \
  --relative-results \
  -- \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.plist-lint]
run = "plutil -lint Config/*.plist"

[tasks.lint]
depends = [":plist-lint", ":periphery"]

[tasks.test]
run = """
xcodebuild test \
  -project Iasis.xcodeproj \
  -scheme Iasis \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""
