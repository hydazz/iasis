[tools]
periphery = "3.8.0"
swiftformat = "0.64.7"

[tasks.format]
run = "swiftformat Iasis IasisTests"

[tasks.fmt-check]
run = "swiftformat Iasis IasisTests --lint"

[tasks.build]
description = "Build the unsigned macOS app"
run = """
xcodebuild build \
  -project Iasis.xcodeproj \
  -scheme Iasis \
  -destination 'generic/platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.periphery]
description = "Build the app and reject unused Swift code"
run = """
periphery scan \
  --project Iasis.xcodeproj \
  --schemes Iasis \
  --format xcode \
  --strict \
  --disable-update-check \
  --relative-results \
  -- \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.plist-lint]
description = "Lint property lists"
run = "plutil -lint Config/*.plist"

[tasks.lint]
description = "Check Swift code and property lists"
depends = [":plist-lint", ":periphery"]

[tasks.test]
description = "Run the macOS test suite"
run = """
xcodebuild test \
  -project Iasis.xcodeproj \
  -scheme Iasis \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.package]
description = "Archive the app with the host tools and zip it, unsigned"
depends = ["//:host:build"]
run = [
  """
xcodebuild archive \
  -project Iasis.xcodeproj \
  -scheme Iasis \
  -destination 'generic/platform=macOS' \
  -archivePath build/Iasis.xcarchive \
  ARCHS=arm64 \
  CODE_SIGNING_ALLOWED=NO
""",
  "rm -f build/Iasis.zip",
  "ditto -c -k --keepParent build/Iasis.xcarchive/Products/Applications/Iasis.app build/Iasis.zip",
]
