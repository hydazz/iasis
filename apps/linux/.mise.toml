# GTK 4 and libadwaita for the app; a virtual display and session bus for
# the smoke test; validators for its desktop entry and AppStream metadata.
[bootstrap.packages]
"apt:libgtk-4-dev" = { os = "linux" }
"apt:libadwaita-1-dev" = { os = "linux" }
"apt:adwaita-icon-theme" = { os = "linux" }
"apt:librsvg2-common" = { os = "linux" }
"apt:dbus" = { os = "linux" }
"apt:xvfb" = { os = "linux" }
"apt:xauth" = { os = "linux" }
"apt:desktop-file-utils" = { os = "linux" }
"apt:appstream" = { os = "linux" }

[tasks.build]
description = "Build the Linux app"
run = "cargo build --locked -p iasis-desktop"

[tasks.lint]
description = "Lint the Linux app, its desktop entry and its AppStream metadata"
run = [
  "cargo clippy --locked -p iasis-desktop --all-targets -- -D warnings",
  "desktop-file-validate data/com.hydaz.Iasis.desktop",
  "appstreamcli validate --no-net data/com.hydaz.Iasis.metainfo.xml",
]

[tasks.test]
description = "Test the Linux app's presentation logic"
run = "cargo test --locked -p iasis-desktop --bin iasis-desktop"

[tasks.smoke]
description = "Start the app on a virtual display against the contract's example state"
run = "xvfb-run -a dbus-run-session -- cargo test --locked -p iasis-desktop --test smoke"

[tasks.run]
description = "Run the app against the agent on this machine"
run = "cargo run --locked -p iasis-desktop"
