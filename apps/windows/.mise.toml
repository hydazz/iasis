[vars]
version = "0.1.0" # x-release-please-version

[tools]
dotnet = { version = "10", os = ["windows"] }
"dotnet:wix" = { version = "7.0.1", os = ["windows"] }

[tasks.build]
run = "dotnet build Iasis.slnx -c Release"

[tasks.lint]
run = "dotnet format Iasis.slnx --verify-no-changes"

[tasks.test]
run = "dotnet test Iasis.Tests -c Release"

[tasks.run]
run = "dotnet run --project Iasis -c Release"

[tasks.package]
description = "MSI"
run = [
  "dotnet publish Iasis -c Release -p:Version={{ vars.version }} -o build/app",
  # The extension's version is wix's.
  "wix extension add -acceptEula wix7 -g WixToolset.Util.wixext/7.0.1",
  "wix build Installer/Package.wxs -arch x64 -acceptEula wix7 -ext WixToolset.Util.wixext -d Version={{ vars.version }} -d AppDir={{ config_root }}/build/app -d ToolsDir={{ config_root }}/../../target/x86_64-pc-windows-gnu/release -o build/Iasis-{{ vars.version }}-x64.msi",
]
