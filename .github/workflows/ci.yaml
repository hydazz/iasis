---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  software:
    name: Software (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - xcode-27
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: --locked rust github:raspberrypi/pico-sdk-tools

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Linux host build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev build-essential git autoconf automake libtool pkg-config cmake libssl-dev libcurl4-openssl-dev zlib1g-dev

      - name: Install macOS host build tools
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config cmake openssl

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: mise run rust:fmt-check

      - name: Lint host software
        run: mise run host:lint

      - name: Test host software
        run: mise run host:test

      - name: Build host
        run: mise run host:build

      - name: Check firmware
        if: runner.os == 'Linux'
        run: |
          mise run firmware:lint
          mise run firmware:test
          mise run firmware:uf2

  app:
    name: App
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: --locked rust github:raspberrypi/pico-sdk-tools periphery swiftformat shellcheck

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install native build tools
        run: brew install autoconf automake libtool pkg-config cmake openssl

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check app formatting
        run: mise run //app:fmt-check

      - name: Lint app
        run: mise run //app:lint

      - name: Test app
        run: mise run //app:test

      - name: Package app with host tools
        run: mise run //app:package

  hardware:
    name: Hardware
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    container:
      # -full carries the stock 3D models the STEP exports and fit test need.
      image: kicad/kicad:10.0.8-full@sha256:4ae56a2c3202334383ab70ad698c649d7a9e2b7ba207088b2a38eca40a2b4e84
      # The image's default user, kicad, can't write the runner's workspace.
      options: --user root
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl

      - name: Setup Mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: --locked jactionlint python uv ruff node npm:pyright

      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: jactionlint --online --shellcheck= --format github

      - name: Check Python formatting
        run: mise run python:fmt-check

      - name: Lint Python
        run: mise run python:lint

      - name: Run Python tests
        run: mise run python:test

      - name: Lint schematics and boards
        run: mise run //hardware/boards/...:lint

      # - name: Test enclosure fit
      #   run: mise run //hardware/case:test

      - name: Build fabrication files
        run: mise run //hardware/boards/...:fab

      - name: Build case
        run: mise run //hardware/case:build

      # Also on failure: build/boards/*/drc.json and erc.json hold the violations.
      - name: Upload build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hardware
          path: build/
          retention-days: 14
          if-no-files-found: ignore

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - app
      - hardware
      - software
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$RESULTS"
