---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false

      - name: Install system packages
        run: mise -C apps/linux bootstrap packages apply --yes

      - name: Install tools
        run: mise install --locked rust github:raspberrypi/pico-sdk-tools

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check Rust formatting
        run: mise run rust:fmt-check

      - name: Lint host software
        run: mise run host:lint

      - name: Test host software
        run: mise run host:test

      - name: Build host
        run: mise run host:build

      - name: Lint Linux app
        run: mise run //apps/linux:lint

      - name: Test Linux app
        run: mise run //apps/linux:test

      - name: Smoke-test Linux app
        run: mise run //apps/linux:smoke

      - name: Check firmware
        run: |
          mise run firmware:lint
          mise run firmware:test
          mise run firmware:uf2

  macos:
    name: macOS host
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false

      - name: Install system packages
        run: mise bootstrap packages apply --yes

      - name: Install tools
        run: mise install --locked rust github:raspberrypi/pico-sdk-tools

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lint host software
        run: mise run host:lint

      - name: Test host software
        run: mise run host:test

      - name: Build host
        run: mise run host:build

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rust's GNU host, as RestoreKit builds on Windows: the host tools' build
      # scripts then link with MinGW rather than MSVC.
      - name: Use the GNU Rust host
        run: rustup set default-host x86_64-pc-windows-gnu

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          working_directory: apps/windows

      - name: Setup MSYS2
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            base-devel autoconf automake libtool autoconf-archive gettext-devel pkgconf perl
            mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-cmake
            mingw-w64-x86_64-nasm

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build host software
        shell: msys2 {0}
        run: mise run host:build-windows

      - name: Lint Windows app
        run: mise run //apps/windows:lint

      - name: Test Windows app
        run: mise run //apps/windows:test

      - name: Build Windows app
        run: mise run //apps/windows:build

  app:
    name: App
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: --locked periphery swiftformat

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check app formatting
        run: mise run //apps/macos:fmt-check

      - name: Lint app
        run: mise run //apps/macos:lint

      - name: Test app
        run: mise run //apps/macos:test

  hardware:
    name: Hardware
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    container:
      # -full carries the stock 3D models the STEP exports and fit test need.
      image: kicad/kicad:10.0.8-full@sha256:4ae56a2c3202334383ab70ad698c649d7a9e2b7ba207088b2a38eca40a2b4e84
      # The image's default user, kicad, can't write the runner's workspace.
      options: --user root
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: --locked jactionlint python uv ruff node npm:pyright

      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: jactionlint --online --shellcheck= --format github

      - name: Check Python formatting
        run: mise run python:fmt-check

      - name: Lint Python
        run: mise run python:lint

      - name: Run Python tests
        run: mise run python:test

      - name: Lint schematics and boards
        run: mise run //hardware/boards/...:lint

      - name: Test enclosure fit
        run: mise run //hardware/case:test

      - name: Build fabrication files
        run: mise run //hardware/boards/...:fab

      - name: Build case
        run: mise run //hardware/case:build

      # Also on failure: build/boards/*/drc.json and erc.json hold the violations.
      - name: Upload build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hardware
          path: build/
          retention-days: 14
          if-no-files-found: ignore

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - app
      - hardware
      - linux
      - macos
      - windows
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$RESULTS"
