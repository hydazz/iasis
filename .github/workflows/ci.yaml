---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          experimental: true
          install_args: --locked aqua:jdx/jactionlint

      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: jactionlint --online --shellcheck= --format github

  software:
    name: Software (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          experimental: true
          install_args: --locked rust

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check Rust formatting
        run: mise run software:fmt-check

      - name: Lint Rust
        run: mise run software:lint

      - name: Run Rust tests
        run: mise run software:test

      - name: Build host
        run: mise run host:build

      - name: Build firmware
        if: ${{ runner.os == 'Linux' }}
        run: mise run firmware:build

  hardware:
    name: Hardware
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    container:
      # -full carries the stock 3D models the STEP exports and fit test need.
      image: kicad/kicad:10.0.7-full@sha256:347d5b7d5d88207ba4217cdf594eeccd142279600d023e7a7e426f8599c77708
      # The image's default user, kicad, can't write the runner's workspace.
      options: --user root
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl

      - name: Setup Mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          experimental: true
          install_args: --locked python uv ruff node npm:pyright

      - name: Check Python formatting
        run: mise run python:fmt-check

      - name: Lint Python
        run: mise run python:lint

      - name: Run Python tests
        run: mise run python:test

      - name: Lint schematics and boards
        run: mise run //hardware/boards/...:lint

      - name: Test enclosure fit
        run: mise run //hardware/case:test

      - name: Build fabrication files
        run: mise run //hardware/boards/...:fab

      - name: Build case
        run: mise run //hardware/case:build

      # Also on failure: build/boards/*/drc.json and erc.json hold the violations.
      - name: Upload build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hardware
          path: build/
          retention-days: 14
          if-no-files-found: ignore

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - hardware
      - software
      - workflow-lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
