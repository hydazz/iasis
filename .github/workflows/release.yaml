---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      board: ${{ steps.tag.outputs.board }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Software is tagged v1.2.3 and a board iasis-board-v1.2.3. The tag's
      # version must be the one in the release's files.
      - name: Check release version
        id: tag
        run: |
          case "${RELEASE_TAG}" in
            v*)
              VERSION="${RELEASE_TAG#v}"
              grep -Fqx "version = \"${VERSION}\"" Cargo.toml
              grep -Fqx "MARKETING_VERSION = ${VERSION} // x-release-please-version" app/Config/Version.xcconfig
              ;;
            *-board-v*)
              BOARD="${RELEASE_TAG%-board-v*}"
              VERSION="${RELEASE_TAG#*-board-v}"
              test "$(cat "hardware/boards/${BOARD}/version.txt")" = "${VERSION}"
              ;;
            *)
              exit 1
              ;;
          esac
          echo "board=${BOARD:-}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  firmware:
    name: Firmware
    needs: tag
    if: needs.tag.outputs.board == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: false
          install_args: --locked rust github:raspberrypi/pico-sdk-tools

      - name: Build IasisOS
        run: mise run firmware:build

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/thumbv8m.main-none-eabihf/release/IasisOS.uf2 "IasisOS-${VERSION}.uf2"
          gh release upload "${RELEASE_TAG}" "IasisOS-${VERSION}.uf2" --clobber

  linux:
    name: Linux (${{ matrix.arch }})
    needs: tag
    if: needs.tag.outputs.board == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: false
          install_args: --locked rust

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build host tools
        run: mise run host:build

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCHIVE="iasis-${VERSION}-linux-${ARCH}.tar.gz"
          tar -C target/release -czf "${ARCHIVE}" iasis iasisd iasis-gateway
          gh release upload "${RELEASE_TAG}" "${ARCHIVE}" --clobber

  macos:
    name: macOS
    needs: tag
    if: needs.tag.outputs.board == ''
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      APP_NAME: Iasis
      PROJECT: app/Iasis.xcodeproj
      SCHEME: Iasis
      PKG_SIGNING_IDENTITY: "Developer ID Installer: Woodleigh School (SMLKBTR495)"

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Import Developer ID Application certificate
        id: application-certificate
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Setup Mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: false
          install_args: --locked rust

      - name: Build host tools
        run: mise run host:build

      - name: Archive app
        run: |
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            ARCHS=arm64 \
            DEVELOPMENT_TEAM="SMLKBTR495" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            archive

      - name: Export app
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist app/Config/ExportOptions.plist

      - name: Import Developer ID Installer certificate
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          create-keychain: false
          keychain-password: ${{ steps.application-certificate.outputs.keychain-password }}
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Stage package payload
        run: |
          codesign --verify --deep --strict "${RUNNER_TEMP}/export/${APP_NAME}.app"
          ditto --norsrc app/packaging/root "${RUNNER_TEMP}/payload"
          ditto --norsrc "${RUNNER_TEMP}/export/${APP_NAME}.app" \
            "${RUNNER_TEMP}/payload/Applications/${APP_NAME}.app"

      - name: Build package
        id: package
        uses: woodleighschool/.github/actions/apple-pkg@583bc37748899a9154880b1c538b15cf46b5b05d # apple-pkg-v1.0.0
        with:
          payload-root: ${{ runner.temp }}/payload
          scripts: app/packaging/scripts
          identifier: com.hydaz.Iasis
          version: ${{ env.VERSION }}
          signing-identity: ${{ env.PKG_SIGNING_IDENTITY }}
          output: dist/${{ env.APP_NAME }}-${{ env.VERSION }}.pkg

      - name: Notarize package
        uses: woodleighschool/.github/actions/apple-notarize@a85ca6bcf210fe5e22e50da1d832f211c2b44605 # apple-notarize-v2.0.0
        with:
          product-path: ${{ steps.package.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Verify package
        env:
          PKG_PATH: ${{ steps.package.outputs.path }}
        run: |
          pkgutil --check-signature "${PKG_PATH}"
          spctl --assess --type install --verbose=2 "${PKG_PATH}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_PATH: ${{ steps.package.outputs.path }}
        run: |
          gh release upload \
            "${RELEASE_TAG}" \
            "${PKG_PATH}" \
            --clobber

  board:
    name: Board
    needs: tag
    if: needs.tag.outputs.board != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    container:
      image: kicad/kicad:10.0.8-full@sha256:4ae56a2c3202334383ab70ad698c649d7a9e2b7ba207088b2a38eca40a2b4e84
      # The image's default user, kicad, can't write the runner's workspace.
      options: --user root
    permissions:
      contents: read
    env:
      BOARD: ${{ needs.tag.outputs.board }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl

      - name: Setup Mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: false
          install_args: --locked python uv

      - name: Check board
        run: mise run "//hardware/boards/${BOARD}:lint"

      - name: Build fabrication files
        run: mise run "//hardware/boards/${BOARD}:fab"

      - name: Name release assets
        run: |
          mkdir dist
          cd "build/boards/${BOARD}"
          for file in gerbers.zip bom*.csv cpl*.csv; do
            cp "${file}" "${GITHUB_WORKSPACE}/dist/${BOARD}-board-${VERSION}-${file}"
          done

      - name: Upload fabrication files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: board
          path: dist/
          if-no-files-found: error

  board-assets:
    name: Board assets
    needs: board
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Release Please publishes every release as latest and has no per-package
      # opt-out (googleapis/release-please#2317).
      - name: Mark the software release as latest
        run: |
          software_tag="$(gh release list --exclude-drafts --exclude-pre-releases --json tagName \
            --jq 'first(.[].tagName | select(startswith("v")))')"
          if [[ -n "${software_tag}" ]]; then
            gh release edit "${software_tag}" --latest
          fi

      - name: Download fabrication files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: board
          path: dist

      - name: Upload release assets
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber
