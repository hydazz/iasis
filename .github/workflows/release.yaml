---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      board: ${{ steps.tag.outputs.board }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Software is tagged v1.2.3 and a board iasis-board-v1.2.3. The tag's
      # version must be the one in the release's files.
      - name: Check release version
        id: tag
        run: |
          case "${RELEASE_TAG}" in
            v*)
              VERSION="${RELEASE_TAG#v}"
              grep -Fqx "version = \"${VERSION}\"" Cargo.toml
              grep -Fqx "version = \"${VERSION}\" # x-release-please-version" crates/iasis/windows/.mise.toml
              grep -Fqx "MARKETING_VERSION = ${VERSION} // x-release-please-version" apps/macos/Config/Version.xcconfig
              ;;
            *-board-v*)
              BOARD="${RELEASE_TAG%-board-v*}"
              VERSION="${RELEASE_TAG#*-board-v}"
              test "$(cat "hardware/boards/${BOARD}/version.txt")" = "${VERSION}"
              ;;
            *)
              exit 1
              ;;
          esac
          echo "board=${BOARD:-}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  firmware:
    name: Firmware
    needs: tag
    if: needs.tag.outputs.board == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          install_args: --locked rust github:raspberrypi/pico-sdk-tools

      - name: Build IasisOS
        run: mise run firmware:build

      - name: Keep IasisOS for the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iasisos
          path: target/thumbv8m.main-none-eabihf/release/IasisOS.uf2
          if-no-files-found: error

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/thumbv8m.main-none-eabihf/release/IasisOS.uf2 "IasisOS-${VERSION}.uf2"
          gh release upload "${RELEASE_TAG}" "IasisOS-${VERSION}.uf2" --clobber

  linux:
    name: Linux (${{ matrix.arch }})
    needs: [tag, firmware]
    if: needs.tag.outputs.board == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          install: false

      - name: Install system packages
        run: mise bootstrap packages apply --yes --update

      - name: Install tools
        run: mise install --locked rust cargo:cargo-deb github:raspberrypi/pico-sdk-tools

      - name: Download IasisOS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iasisos
          path: target/thumbv8m.main-none-eabihf/release

      - name: Build package
        run: |
          mise run --skip-deps host:build
          mise run --skip-deps deb

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" target/debian/iasis_*_${{ matrix.arch }}.deb --clobber --repo "${GITHUB_REPOSITORY}"

  windows:
    name: Windows
    needs: [tag, firmware]
    if: needs.tag.outputs.board == ''
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the GNU Rust host
        run: rustup set default-host x86_64-pc-windows-gnu

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          install: false

      - name: Install tools
        run: mise -C crates/iasis/windows install --locked rust github:raspberrypi/pico-sdk-tools dotnet

      - name: Setup MSYS2
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: MINGW64
          release: false
          update: true
          path-type: inherit

      - name: Install MSYS2 packages
        run: mise run bootstrap

      - name: Download IasisOS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iasisos
          path: target/thumbv8m.main-none-eabihf/release

      - name: Build host tools
        shell: msys2 {0}
        run: mise run --skip-deps host:build

      - name: Build MSI
        run: mise run //crates/iasis/windows:package

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" "crates/iasis/windows/build/Iasis-${VERSION}-x64.msi" --clobber --repo "${GITHUB_REPOSITORY}"

  macos:
    name: macOS
    needs: [tag, firmware]
    if: needs.tag.outputs.board == ''
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      APP_NAME: Iasis
      PROJECT: apps/macos/Iasis.xcodeproj
      SCHEME: Iasis

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Import Developer ID Application certificate
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          install_args: --locked rust github:raspberrypi/pico-sdk-tools

      - name: Install system packages
        run: mise bootstrap packages apply --yes

      - name: Download IasisOS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iasisos
          path: target/thumbv8m.main-none-eabihf/release

      - name: Build host tools
        run: mise run --skip-deps host:build

      - name: Archive app
        run: |
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            ARCHS=arm64 \
            DEVELOPMENT_TEAM="SMLKBTR495" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            archive

      - name: Export app
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist apps/macos/Config/ExportOptions.plist

      - name: Notarize app
        uses: woodleighschool/.github/actions/apple-notarize@a85ca6bcf210fe5e22e50da1d832f211c2b44605 # apple-notarize-v2.0.0
        with:
          product-path: ${{ runner.temp }}/export/${{ env.APP_NAME }}.app
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Verify app
        run: |
          APP_PATH="${RUNNER_TEMP}/export/${APP_NAME}.app"

          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          spctl --assess --type execute --verbose=2 "${APP_PATH}"

      - name: Create ZIP
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            "${RUNNER_TEMP}/export/${APP_NAME}.app" \
            "dist/${APP_NAME}-${VERSION}.zip"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${RELEASE_TAG}" \
            "dist/${APP_NAME}-${VERSION}.zip" \
            --clobber

  board:
    name: Board
    needs: tag
    if: needs.tag.outputs.board != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    container:
      image: kicad/kicad:10.0.8-full@sha256:4ae56a2c3202334383ab70ad698c649d7a9e2b7ba207088b2a38eca40a2b4e84
      # The image's default user, kicad, can't write the runner's workspace.
      options: --user root
    permissions:
      contents: read
    env:
      BOARD: ${{ needs.tag.outputs.board }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          install_args: --locked python uv

      - name: Check board
        run: mise run "//hardware/boards/${BOARD}:lint"

      - name: Build fabrication files
        run: mise run "//hardware/boards/${BOARD}:fab"

      - name: Name release assets
        run: |
          mkdir dist
          cd "build/boards/${BOARD}"
          for file in gerbers.zip bom*.csv cpl*.csv; do
            cp "${file}" "${GITHUB_WORKSPACE}/dist/${BOARD}-board-${VERSION}-${file}"
          done

      - name: Upload fabrication files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: board
          path: dist/
          if-no-files-found: error

  board-assets:
    name: Board assets
    needs: board
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Release Please publishes every release as latest and has no per-package
      # opt-out (googleapis/release-please#2317).
      - name: Mark the software release as latest
        run: |
          software_tag="$(gh release list --exclude-drafts --exclude-pre-releases --json tagName \
            --jq 'first(.[].tagName | select(startswith("v")))')"
          if [[ -n "${software_tag}" ]]; then
            gh release edit "${software_tag}" --latest
          fi

      - name: Download fabrication files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: board
          path: dist

      - name: Upload release assets
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber
