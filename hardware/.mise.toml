[env]
# tf ur not using macos
_.path = ["/Applications/KiCad/KiCad.app/Contents/MacOS"]

[tasks.lint]
run = ["ruff check", "uv run --locked pyright"]

[tasks.test]
run = 'uv run --locked python -m unittest discover -s tools -p "test_*.py"'

[task_templates."pcb:step"]
sources = [
  "*.3dshapes/*",
  "*.kicad_pcb",
  "*.kicad_pro",
  "../../shared/Iasis.3dshapes/*",
  "../../../.mise/config.toml",
  "../../../pyproject.toml",
  "../../../uv.lock",
  "../../.mise.toml",
  "../../tools/board.py",
  ".mise.toml",
]
outputs = ["../../../build/boards/{{ config_root | basename }}/board.step"]
run = 'uv run --locked python "{{ config_root }}/../../tools/board.py"'

[task_templates."pcb:fab"]
description = "JLCPCB"
run = 'uv run --locked python "{{ config_root }}/../../tools/fab.py"'

[task_templates."pcb:preview"]
sources = [
  "*.3dshapes/*",
  "*.kicad_pcb",
  "*.kicad_pro",
  "../../shared/Iasis.3dshapes/*",
  "../../../.mise/config.toml",
  "../../../pyproject.toml",
  "../../../uv.lock",
  "../../.mise.toml",
  "../../tools/board.py",
  "../../tools/preview.py",
  ".mise.toml",
]
outputs = ["board.png"]
run = 'uv run --locked python "{{ config_root }}/../../tools/preview.py"'

[task_templates."pcb:lint"]
description = "DRC, ERC, schematic parity"
run = 'uv run --locked python "{{ config_root }}/../../tools/board.py" --check'
