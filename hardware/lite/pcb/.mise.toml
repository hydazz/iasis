[tasks.step]
description = "Export the populated board STEP"
sources = ["iasis.kicad_pcb", "iasis.kicad_pro", "Iasis.3dshapes/*", ".mise.toml"]
outputs = ["build/board.step"]
run = [
  "mkdir -p build",
  '"$KICAD_CLI" pcb export step --subst-models --force -o build/board.step iasis.kicad_pcb',
]

[tasks.fab]
description = "Export Gerbers, drills, BOMs and placements"
run = "python3 fab.py"

[tasks.preview]
description = "Render the board and plot the copper layout"
sources = ["iasis.kicad_pcb", "iasis.kicad_pro", "Iasis.3dshapes/*", "preview.py"]
outputs = ["preview/board.png", "preview/layout.png"]
run = "python3 preview.py"

[tasks.check]
description = "Run PCB design rules, schematic parity and electrical checks"
run = [
  "mkdir -p build",
  '"$KICAD_CLI" pcb drc --schematic-parity --exit-code-violations --format json -o build/drc.json iasis.kicad_pcb',
  '"$KICAD_CLI" sch erc --severity-error --exit-code-violations --format json -o build/erc.json iasis.kicad_sch',
]

[tasks.diff]
description = "Show board changes against a git revision"
run = "python3 diff.py"
