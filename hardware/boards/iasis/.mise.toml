[tasks.step]
description = "Export the populated board STEPs: HubPD (fits Hub too) and CM5"
sources = ["iasis.kicad_pcb", "iasis.kicad_pro", "../../shared/Iasis.3dshapes/*", ".mise.toml"]
outputs = ["../../../build/boards/iasis/board.step", "../../../build/boards/iasis/board-cm5.step"]
run = [
  "mkdir -p ../../../build/boards/iasis",
  '"$KICAD_CLI" pcb export step --subst-models --force --variant HubPD --no-dnp -o ../../../build/boards/iasis/board.step iasis.kicad_pcb',
  '"$KICAD_CLI" pcb export step --subst-models --force --variant CM5 --no-dnp -o ../../../build/boards/iasis/board-cm5.step iasis.kicad_pcb',
]

[tasks.fab]
description = "Export Gerbers, drills, BOMs and placements"
run = "python3 fab.py"

[tasks.preview]
description = "Render the board and plot the copper layout"
sources = ["iasis.kicad_pcb", "iasis.kicad_pro", "../../shared/Iasis.3dshapes/*", "preview.py"]
outputs = ["preview/board.png", "preview/layout.png"]
run = "python3 preview.py"

[tasks.check]
description = "Run PCB design rules, schematic parity and electrical checks"
run = [
  "mkdir -p ../../../build/boards/iasis",
  '"$KICAD_CLI" pcb drc --schematic-parity --exit-code-violations --format json -o ../../../build/boards/iasis/drc.json iasis.kicad_pcb',
  '"$KICAD_CLI" sch erc --severity-error --exit-code-violations --format json -o ../../../build/boards/iasis/erc.json iasis.kicad_sch',
]

[tasks.diff]
description = "Show board changes against a git revision"
run = "python3 diff.py"
