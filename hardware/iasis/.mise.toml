[tasks.preview]
description = "Render and plot the board into preview/ for git history (needs KiCad)"
sources = ["iasis.kicad_pcb", "Iasis.3dshapes/*", "preview.py"]
outputs = ["preview/board.png", "preview/layout.png"]
run = "python3 preview.py"

[tasks.fab]
description = "Write the JLC fab files: gerber and drill zip, BOM and CPL per variant (needs KiCad)"
depends = ["preview"]
sources = ["*.kicad_pcb", "*.kicad_sch", "*.kicad_pro", "jlc_cpl.py"]
outputs = ["build/gerbers.zip", "build/bom-Hub.csv", "build/bom-HubPD.csv", "build/cpl-Hub.csv", "build/cpl-HubPD.csv"]
run = '''
rm -rf build && mkdir -p build/gerbers
"$KICAD_CLI" pcb export gerbers --check-zones -o build/gerbers -l F.Cu,In1.Cu,In2.Cu,In3.Cu,In4.Cu,B.Cu,F.Paste,F.Silkscreen,B.Silkscreen,F.Mask,B.Mask,Edge.Cuts iasis.kicad_pcb
"$KICAD_CLI" pcb export drill --excellon-separate-th -o build/gerbers iasis.kicad_pcb
zip -jq build/gerbers.zip build/gerbers/* -x '*.gbrjob'
for v in Hub HubPD; do
  "$KICAD_CLI" sch export bom --variant $v --exclude-dnp --group-by LCSC --ref-range-delimiter '' -o build/bom-$v.csv \
    --fields 'Value,Reference,Footprint,LCSC,MPN,Manufacturer,${QUANTITY}' \
    --labels 'Comment,Designator,Footprint,LCSC Part #,MPN,Manufacturer,Quantity' iasis.kicad_sch
  "$KICAD_CLI" pcb export pos --variant $v --exclude-dnp --format csv --units mm -o build/pos.csv iasis.kicad_pcb
  python3 jlc_cpl.py build/pos.csv build/bom-$v.csv build/cpl-$v.csv
done
rm build/pos.csv
'''

[tasks.diff]
description = "Show the board's changes against a git revision (default HEAD) in the browser (needs KiCad)"
run = "python3 diff.py"
