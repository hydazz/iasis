[project]
name = "iasis-case"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["build123d>=0.13.0"]

[dependency-groups]
dev = ["ocp-vscode>=4.2.0"]

[project.scripts]
iasis-case-build = "iasis_case.build:main"
iasis-case-preview = "iasis_case.preview:main"
iasis-case-check = "iasis_case.check:main"
iasis-case-view = "iasis_case.case:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iasis_case"]
