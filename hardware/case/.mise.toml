[env]
_.python.venv = { path = ".venv", create = true }
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[tasks.board-step]
description = "Export the populated board STEP (needs KiCad)"
sources = ["../iasis/iasis.kicad_pcb", "../iasis/Iasis.3dshapes/*"]
outputs = ["build/board.step"]
run = [
  "mkdir -p build",
  '"$KICAD_CLI" pcb export step --subst-models --force -o build/board.step ../iasis/iasis.kicad_pcb',
]

[tasks.case]
description = "Build the enclosure and check its fit against the board STEP"
depends = ["board-step"]
run = "uv run build.py"

[tasks.format]
description = "Format the case sources"
run = "ruff format"

[tasks.lint]
description = "Lint the case sources"
run = ["ruff check", "ruff format --check"]
