[tasks.build]
depends = ["//hardware/boards/iasis:step", "//hardware/boards/cm5:step"]
run = "uv run --locked iasis-case-build"

[tasks.preview]
depends = ["//hardware/boards/iasis:step", "//hardware/boards/cm5:step"]
sources = [
  "src/**/*.json",
  "src/**/*.py",
  "src/**/*.svg",
  "../../.mise/config.toml",
  "../../build/boards/cm5/board.step",
  "../../build/boards/iasis/board.step",
  "../../pyproject.toml",
  "../../uv.lock",
  ".mise.toml",
]
outputs = ["preview/case-cm5.png", "preview/case-sheet.png", "preview/case.png"]
run = "uv run --locked iasis-case-preview"

[tasks.sheet]
description = "Sheet-metal case order files"
depends = ["//hardware/boards/iasis:step"]
run = "uv run --locked iasis-case-sheet"

[tasks.test]
description = "Fit and motion"
depends = ["//hardware/boards/iasis:step", "//hardware/boards/cm5:step"]
run = [
  "uv run --locked iasis-case-check",
  "uv run --locked iasis-case-check --cm5",
  "uv run --locked iasis-case-sheet --check-only",
]

[tasks.view]
description = "OCP CAD Viewer"
depends = ["//hardware/boards/iasis:step"]
run = "uv run --locked iasis-case-view"

[tasks.view-cm5]
depends = ["//hardware/boards/iasis:step", "//hardware/boards/cm5:step"]
run = "uv run --locked iasis-case-view --cm5"
