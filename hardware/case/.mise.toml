[env]
_.python.venv = { path = ".venv", create = true }
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[tasks.deps]
description = "Install the CAD and viewer dependencies"
run = "uv sync --locked"

[tasks.build]
description = "Export the case STLs and assembly STEP"
depends = ["//hardware/boards/iasis:step"]
run = "uv run --locked iasis-case-build"

[tasks.preview]
description = "Render the case preview"
depends = ["//hardware/boards/iasis:step"]
run = "uv run --locked iasis-case-preview"

[tasks.check]
description = "Check enclosure fit and motion against the board"
depends = ["//hardware/boards/iasis:step"]
run = "uv run --locked iasis-case-check"

[tasks.view]
description = "Show the case and board in OCP CAD Viewer"
depends = ["//hardware/boards/iasis:step"]
run = "uv run --locked iasis-case-view"
