[tools]
periphery = "3.8.0"
swiftformat = "0.64.7"

[tasks.format]
run = "swiftformat Iasis IasisTests"

[tasks.fmt-check]
run = "swiftformat Iasis IasisTests --lint"

[tasks.build]
description = "Build the unsigned macOS app with the host tools inside"
run = """
xcodebuild build \
  -project Iasis.xcodeproj \
  -scheme Iasis \
  -destination 'generic/platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.periphery]
description = "Build the app and reject unused Swift code"
run = """
periphery scan \
  --project Iasis.xcodeproj \
  --schemes Iasis \
  --format xcode \
  --strict \
  --disable-update-check \
  --relative-results \
  -- \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.lint]
description = "Check for unused Swift code"
depends = [":periphery"]

[tasks.test]
description = "Run the macOS test suite"
run = """
xcodebuild test \
  -project Iasis.xcodeproj \
  -scheme Iasis \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.package]
description = "Build the release app and an unsigned installer package"
run = """
xcodebuild build \
  -project Iasis.xcodeproj \
  -scheme Iasis \
  -configuration Release \
  -destination 'generic/platform=macOS' \
  -derivedDataPath build \
  ARCHS=arm64 \
  CODE_SIGNING_ALLOWED=NO
scripts/package.sh build/Build/Products/Release/Iasis.app build/Iasis.pkg
"""
