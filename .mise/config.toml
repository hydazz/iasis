monorepo_root = true

[tools]
python = "3.14.7"
uv = "0.12.20"
ruff = "0.17.3"
lefthook = "2.2.2"
oxfmt = "0.74.0"
node = "26.12.1"
"npm:pyright" = "1.1.414"

[settings]
experimental = true
pin = true
lockfile = true

[env]
# tf ur not using macos
_.path = ["/Applications/KiCad/KiCad.app/Contents/MacOS"]
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[monorepo]
config_roots = ["hardware/case", "hardware/boards/*"]

[hooks]
postinstall = "lefthook install"

[tasks.deps]
description = "Install the Python workspace dependencies"
run = "uv sync --locked"

[tasks.build]
description = "Build the case and each board's fabrication files"
depends = ["//hardware/case:build", "//hardware/boards/...:fab"]

[tasks.preview]
description = "Refresh the case and board previews"
depends = ["//hardware/case:preview", "//hardware/boards/...:preview"]

[tasks.check]
description = "Check sources, enclosure fit and KiCad designs"
depends = [
  "lint",
  "typecheck",
  "fmt-check",
  "test",
  "//hardware/case:check",
  "//hardware/boards/...:check",
]

[tasks.lint]
description = "Lint Python sources"
run = "ruff check hardware"

[tasks.typecheck]
description = "Check Python types"
run = "uv run --locked pyright"

[tasks.test]
description = "Test JLCPCB placement conversion"
run = 'uv run --locked python -m unittest discover -s hardware/tools -p "test_*.py"'

[tasks.format]
description = "Format Python, Markdown and configuration"
depends = ["//hardware/case:format", "//hardware/boards/...:format"]
run = ["mise fmt", "ruff format hardware", "oxfmt"]

[tasks.fmt-check]
description = "Check repository formatting"
depends = ["//hardware/case:fmt-check", "//hardware/boards/...:fmt-check"]
run = ["mise fmt --check", "ruff format --check hardware", "oxfmt --check"]

[task_templates."pcb:step"]
description = "Export the populated board STEP"
vars = { args = "" }
sources = [
  "*.3dshapes/*",
  "*.kicad_pcb",
  "*.kicad_pro",
  "../../shared/Iasis.3dshapes/*",
  "../../../.mise/config.toml",
  "../../../pyproject.toml",
  "../../../uv.lock",
  "../../tools/board.py",
  ".mise.toml",
]
outputs = ["../../../build/boards/{{ config_root | basename }}/board.step"]
run = 'uv run --locked python "{{ config_root }}/../../tools/board.py" {{ vars.args }}'

[task_templates."pcb:fab"]
description = "Export JLCPCB fabrication and assembly files"
vars = { args = "" }
run = 'uv run --locked python "{{ config_root }}/../../tools/fab.py" {{ vars.args }}'

[task_templates."pcb:preview"]
description = "Render the board photo"
vars = { args = "" }
sources = [
  "*.3dshapes/*",
  "*.kicad_pcb",
  "*.kicad_pro",
  "../../shared/Iasis.3dshapes/*",
  "../../../.mise/config.toml",
  "../../../pyproject.toml",
  "../../../uv.lock",
  "../../tools/board.py",
  "../../tools/preview.py",
  ".mise.toml",
]
outputs = ["board.png"]
run = 'uv run --locked python "{{ config_root }}/../../tools/preview.py" {{ vars.args }}'

[task_templates."pcb:check"]
description = "Run DRC, schematic parity and ERC"
run = 'uv run --locked python "{{ config_root }}/../../tools/board.py" --check'

[task_templates."project:format"]
description = "Format mise configuration"
run = "mise fmt"

[task_templates."project:fmt-check"]
description = "Check mise formatting"
run = "mise fmt --check"
