monorepo_root = true

[tools]
python = "3.14.10"
rust = { version = "1.99.1", components = "rustfmt,clippy", targets = "thumbv8m.main-none-eabihf" }
uv = "0.13.5"
ruff = "0.17.2"
lefthook = "2.2.2"
"aqua:jdx/jactionlint" = "2.3.0"
oxfmt = "0.74.0"
node = "26.12.1"
"npm:pyright" = "1.1.414"

[settings]
experimental = true
pin = true
lockfile = true

[env]
# tf ur not using macos
_.path = ["/Applications/KiCad/KiCad.app/Contents/MacOS"]
UV_PYTHON = "python"

[monorepo]
config_roots = ["hardware/case", "hardware/boards/*"]

[hooks]
postinstall = "lefthook install"

[tasks.deps]
description = "Install workspace dependencies"
run = ["uv sync --locked", "cargo fetch --locked"]

[tasks.build]
description = "Build software, the case and board fabrication files"
depends = [
  "host:build",
  "firmware:build",
  "//hardware/case:build",
  "//hardware/boards/...:fab",
]

[tasks.preview]
description = "Refresh the case and board previews"
depends = ["//hardware/case:preview", "//hardware/boards/...:preview"]

[tasks.lint]
description = "Lint software, hardware and workflows"
depends = ["software:lint", "python:lint", "//hardware/boards/...:lint"]
run = "jactionlint --shellcheck="

[tasks.test]
description = "Test software, board tooling and enclosure fit"
depends = ["software:test", "python:test", "//hardware/case:test"]

[tasks."python:fmt-check"]
description = "Check Python formatting"
run = "ruff format --check hardware"

[tasks."python:lint"]
description = "Lint Python sources and check types"
run = ["ruff check hardware", "uv run --locked pyright"]

[tasks."python:test"]
description = "Test JLCPCB placement conversion"
run = 'uv run --locked python -m unittest discover -s hardware/tools -p "test_*.py"'

[tasks.format]
description = "Format sources, Markdown and configuration"
depends = ["//hardware/case:format", "//hardware/boards/...:format"]
run = ["mise fmt", "ruff format hardware", "cargo fmt --all", "oxfmt"]

[tasks.fmt-check]
description = "Check repository formatting"
depends = [
  "software:fmt-check",
  "python:fmt-check",
  "//hardware/case:fmt-check",
  "//hardware/boards/...:fmt-check",
]
run = ["mise fmt --check", "oxfmt --check"]

[tasks."host:build"]
description = "Build the Iasis host library and CLI"
run = "cargo build --locked --release -p iasis"

[tasks."firmware:build"]
description = "Build the RP2354B firmware ELF"
run = "cargo build --locked --release -p iasis-firmware --target thumbv8m.main-none-eabihf"

[tasks."software:fmt-check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks."software:lint"]
description = "Lint host and firmware sources"
run = [
  "cargo clippy --locked --all-targets -- -D warnings",
  "cargo clippy --locked --release -p iasis-firmware --target thumbv8m.main-none-eabihf -- -D warnings",
]

[tasks."software:test"]
description = "Test host, firmware logic and the wire protocol"
run = ["cargo test --locked", "cargo test --locked -p iasis-firmware --lib"]

[task_templates."pcb:step"]
description = "Export the populated board STEP"
vars = { args = "" }
sources = [
  "*.3dshapes/*",
  "*.kicad_pcb",
  "*.kicad_pro",
  "../../shared/Iasis.3dshapes/*",
  "../../../.mise/config.toml",
  "../../../pyproject.toml",
  "../../../uv.lock",
  "../../tools/board.py",
  ".mise.toml",
]
outputs = ["../../../build/boards/{{ config_root | basename }}/board.step"]
run = 'uv run --locked python "{{ config_root }}/../../tools/board.py" {{ vars.args }}'

[task_templates."pcb:fab"]
description = "Export JLCPCB fabrication and assembly files"
vars = { args = "" }
run = 'uv run --locked python "{{ config_root }}/../../tools/fab.py" {{ vars.args }}'

[task_templates."pcb:preview"]
description = "Render the board photo"
vars = { args = "" }
sources = [
  "*.3dshapes/*",
  "*.kicad_pcb",
  "*.kicad_pro",
  "../../shared/Iasis.3dshapes/*",
  "../../../.mise/config.toml",
  "../../../pyproject.toml",
  "../../../uv.lock",
  "../../tools/board.py",
  "../../tools/preview.py",
  ".mise.toml",
]
outputs = ["board.png"]
run = 'uv run --locked python "{{ config_root }}/../../tools/preview.py" {{ vars.args }}'

[task_templates."pcb:lint"]
description = "Run DRC, schematic parity and ERC"
run = 'uv run --locked python "{{ config_root }}/../../tools/board.py" --check'

[task_templates."project:format"]
description = "Format mise configuration"
run = "mise fmt"

[task_templates."project:fmt-check"]
description = "Check mise formatting"
run = "mise fmt --check"
