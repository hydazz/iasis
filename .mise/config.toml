monorepo_root = true

[tools]
# On Windows the host tools build under MSYS2, with rustup's default host set
# to x86_64-pc-windows-gnu as RestoreKit does.
python = { version = "3.14.10", os = ["linux", "macos"] }
rust = { version = "1.100.0", components = "rustfmt,clippy", targets = "thumbv8m.main-none-eabihf" }
uv = { version = "0.13.10", os = ["linux", "macos"] }
ruff = { version = "0.17.6", os = ["linux", "macos"] }
lefthook = { version = "2.2.3", os = ["linux", "macos"] }
jactionlint = { version = "v2.6.0", os = ["linux", "macos"] }
oxfmt = { version = "0.75.0", os = ["linux", "macos"] }
node = { version = "26.13.1", os = ["linux", "macos"] }
"npm:pyright" = { version = "1.1.414", os = ["linux", "macos"] }
"github:raspberrypi/pico-sdk-tools" = { version = "2.3.1-0", matching = "picotool" }
"cargo:cargo-deb" = { version = "3.8.0", os = ["linux"] }

[settings]
experimental = true
pin = true
lockfile = true

[env]
UV_PYTHON = "python"

[monorepo]
config_roots = [
  "apps/macos",
  "apps/linux",
  "apps/windows",
  "hardware",
  "hardware/case",
  "hardware/boards/*",
]

[hooks]
postinstall = "lefthook install"

# The host tools' C stack. On Windows the bootstrap task installs RestoreKit's
# MSYS2 packages instead.
[bootstrap.packages]
"apt:build-essential" = { os = "linux" }
"apt:autoconf" = { os = "linux" }
"apt:automake" = { os = "linux" }
"apt:libtool" = { os = "linux" }
"apt:pkgconf" = { os = "linux" }
"apt:cmake" = { os = "linux" }
"apt:git" = { os = "linux" }
"apt:patch" = { os = "linux" }
"apt:libpcap-dev" = { os = "linux" }
"apt:libusb-1.0-0-dev" = { os = "linux" }
"brew:autoconf" = { os = "macos" }
"brew:automake" = { os = "macos" }
"brew:libtool" = { os = "macos" }
"brew:pkgconf" = { os = "macos" }
"brew:cmake" = { os = "macos" }
"winget:MSYS2.MSYS2" = { os = "windows" }

[tasks.deps]
run = ["uv sync --locked", "cargo fetch --locked"]

[tasks.build]
depends = [
  "host:build",
  "firmware:build",
  "//hardware/case:build",
  "//hardware/boards/...:fab",
]

[tasks.preview]
depends = ["//hardware/case:preview", "//hardware/boards/...:preview"]

[tasks.lint]
depends = ["host:lint", "firmware:lint", "//hardware/...:lint"]
run = "jactionlint --shellcheck="

[tasks.test]
depends = ["host:test", "firmware:test", "//hardware/...:test"]

[tasks.format]
run = ["mise fmt", "ruff format hardware", "cargo fmt --all", "oxfmt"]

[tasks.fmt-check]
run = [
  "mise fmt --check",
  "ruff format --check hardware",
  "cargo fmt --all -- --check",
  "oxfmt --check",
]

[tasks.bootstrap]
run = []
shell = "C:/msys64/usr/bin/bash.exe -lc"
run_windows = '''
pacman -S --needed --noconfirm \
    base-devel \
    autoconf \
    automake \
    libtool \
    autoconf-archive \
    gettext-devel \
    pkgconf \
    perl \
    mingw-w64-x86_64-gcc \
    mingw-w64-x86_64-pkgconf \
    mingw-w64-x86_64-cmake \
    mingw-w64-x86_64-nasm
'''

[tasks."host:lint"]
run = "cargo clippy --locked --all-targets -- -D warnings"

[tasks."host:test"]
run = "cargo test --locked"

[tasks."host:build"]
depends = ["firmware:build"]
env = { IASIS_OS_UF2 = "{{config_root}}/target/thumbv8m.main-none-eabihf/release/IasisOS.uf2" }
run = "cargo build --locked --release -p iasis"

[tasks."firmware:lint"]
run = "cargo clippy --locked --release -p iasis-firmware --target thumbv8m.main-none-eabihf -- -D warnings"

[tasks."firmware:test"]
run = "cargo test --locked -p iasis-firmware --lib"

[tasks."firmware:build"]
description = "IasisOS.uf2"
run = [
  "cargo build --locked --release -p iasis-firmware --target thumbv8m.main-none-eabihf",
  "picotool uf2 convert --quiet target/thumbv8m.main-none-eabihf/release/iasis-firmware -t elf target/thumbv8m.main-none-eabihf/release/IasisOS.uf2",
]
