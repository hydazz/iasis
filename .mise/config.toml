monorepo_root = true

[tools]
python = "3.14.7"
uv = "0.12.20"
ruff = "0.17.1"
resvg = "0.48.1"
oxipng = "10.2.1"

[settings]
experimental = true
pin = true
lockfile = true

[env]
KICAD_CLI = "/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli"
KICAD_PYTHON = "/Applications/KiCad/KiCad.app/Contents/Frameworks/Python.framework/Versions/Current/bin/python3"

[monorepo]
config_roots = ["hardware/case", "hardware/boards/iasis", "hardware/boards/cm5"]

[tasks.deps]
description = "Install Python dependencies"
depends = ["//hardware/case:deps"]

[tasks.build]
description = "Build the case and PCB fabrication files"
depends = ["//hardware/case:build", "//hardware/boards/iasis:fab"]

[tasks.preview]
description = "Refresh the case and board previews"
depends = ["//hardware/case:preview", "//hardware/boards/iasis:preview"]

[tasks.check]
description = "Check Python sources, enclosure fit and KiCad designs"
depends = ["lint", "fmt-check", "//hardware/case:check", "//hardware/boards/iasis:check"]

[tasks.lint]
description = "Lint Python sources"
run = "ruff check hardware"

[tasks.format]
description = "Format Python sources"
run = "ruff format hardware"

[tasks.fmt-check]
description = "Check Python formatting"
run = "ruff format --check hardware"
