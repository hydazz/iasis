monorepo_root = true

[tools]
# Everything but the Windows app builds on Linux and macOS; Windows has the
# app's own toolchain (apps/windows).
python = { version = "3.14.10", os = ["linux", "macos"] }
rust = { version = "1.100.0", components = "rustfmt,clippy", targets = "thumbv8m.main-none-eabihf,x86_64-pc-windows-gnu", os = [
  "linux",
  "macos",
] }
uv = { version = "0.13.9", os = ["linux", "macos"] }
ruff = { version = "0.17.6", os = ["linux", "macos"] }
lefthook = { version = "2.2.2", os = ["linux", "macos"] }
jactionlint = { version = "v2.6.0", os = ["linux", "macos"] }
oxfmt = { version = "0.75.0", os = ["linux", "macos"] }
node = { version = "26.13.1", os = ["linux", "macos"] }
"npm:pyright" = { version = "1.1.414", os = ["linux", "macos"] }
"github:raspberrypi/pico-sdk-tools" = { version = "2.3.1-0", matching = "picotool", os = [
  "linux",
  "macos",
] }
"cargo:cargo-deb" = { version = "3.8.0", os = ["linux"] }

[settings]
experimental = true
pin = true
lockfile = true

[env]
# tf ur not using macos
_.path = ["/Applications/KiCad/KiCad.app/Contents/MacOS"]
UV_PYTHON = "python"

[monorepo]
config_roots = [
  "apps/macos",
  "apps/linux",
  "apps/windows",
  "hardware/case",
  "hardware/boards/*",
]

[hooks]
postinstall = "lefthook install"

# Native libraries the host tools' vendored C stack builds against, and the
# Debian packaging. The Windows host tools cross-build here with mingw-w64:
# their C stack builds only with GNU autotools.
[bootstrap.packages]
"apt:build-essential" = { os = "linux" }
"apt:autoconf" = { os = "linux" }
"apt:automake" = { os = "linux" }
"apt:libtool" = { os = "linux" }
"apt:pkgconf" = { os = "linux" }
"apt:cmake" = { os = "linux" }
"apt:git" = { os = "linux" }
"apt:patch" = { os = "linux" }
"apt:libssl-dev" = { os = "linux" }
"apt:libcurl4-openssl-dev" = { os = "linux" }
"apt:zlib1g-dev" = { os = "linux" }
"apt:libpcap-dev" = { os = "linux" }
"apt:libusb-1.0-0" = { os = "linux" }
"apt:dpkg-dev" = { os = "linux" }
"apt:gcc-mingw-w64-x86-64" = { os = "linux" }
"apt:g++-mingw-w64-x86-64" = { os = "linux" }
"brew:autoconf" = { os = "macos" }
"brew:automake" = { os = "macos" }
"brew:libtool" = { os = "macos" }
"brew:pkgconf" = { os = "macos" }
"brew:cmake" = { os = "macos" }
"brew:openssl@4" = { os = "macos" }

[tasks.deps]
run = ["uv sync --locked", "cargo fetch --locked"]

[tasks.build]
description = "Build software, the case and board fabrication files"
depends = [
  "host:build",
  "firmware:build",
  "//hardware/case:build",
  "//hardware/boards/...:fab",
]

[tasks.preview]
description = "Refresh the case and board previews"
depends = ["//hardware/case:preview", "//hardware/boards/...:preview"]

[tasks.lint]
description = "Lint software, hardware and workflows"
depends = ["software:lint", "python:lint", "//hardware/boards/...:lint"]
run = "jactionlint --shellcheck="

[tasks.test]
description = "Test software, board tooling and enclosure fit"
depends = ["software:test", "python:test", "//hardware/case:test"]

[tasks."python:fmt-check"]
run = "ruff format --check hardware"

[tasks."python:lint"]
description = "Lint Python sources and check types"
run = ["ruff check hardware", "uv run --locked pyright"]

[tasks."python:test"]
description = "Test JLCPCB placement conversion"
run = 'uv run --locked python -m unittest discover -s hardware/tools -p "test_*.py"'

[tasks.format]
depends = ["//hardware/case:format", "//hardware/boards/...:format"]
run = ["mise fmt", "ruff format hardware", "cargo fmt --all", "oxfmt"]

[tasks.fmt-check]
depends = [
  "software:fmt-check",
  "python:fmt-check",
  "//hardware/case:fmt-check",
  "//hardware/boards/...:fmt-check",
]
run = ["mise fmt --check", "oxfmt --check"]

[tasks."host:build"]
description = "Build the Iasis host tools, carrying IasisOS"
depends = ["firmware:uf2"]
env = { IASIS_OS_UF2 = "{{config_root}}/target/thumbv8m.main-none-eabihf/release/IasisOS.uf2" }
run = "cargo build --locked --release -p iasis"

[tasks."host:package"]
description = "Build the Debian package of the host tools and the Linux app for this machine's architecture"
depends = ["firmware:uf2"]
env = { IASIS_OS_UF2 = "{{config_root}}/target/thumbv8m.main-none-eabihf/release/IasisOS.uf2" }
run = [
  "cargo build --locked --release -p iasis -p iasis-desktop",
  "cargo deb --locked --no-build -p iasis",
]

[tasks."windows:tools"]
description = "Cross-build the Windows host tools, carrying IasisOS"
depends = ["firmware:uf2"]
env = { IASIS_OS_UF2 = "{{config_root}}/target/thumbv8m.main-none-eabihf/release/IasisOS.uf2" }
run = "cargo build --locked --release -p iasis --target x86_64-pc-windows-gnu"

[tasks."windows:lint"]
description = "Lint the host tools as Windows builds them"
run = "cargo clippy --locked -p iasis -p iasis-api --all-targets --target x86_64-pc-windows-gnu -- -D warnings"

[tasks."firmware:build"]
description = "Build IasisOS, the RP2354B firmware"
run = "cargo build --locked --release -p iasis-firmware --target thumbv8m.main-none-eabihf"

[tasks."firmware:uf2"]
description = "Convert the IasisOS ELF to a UF2 image"
depends = ["firmware:build"]
run = "picotool uf2 convert --quiet target/thumbv8m.main-none-eabihf/release/iasis-firmware -t elf target/thumbv8m.main-none-eabihf/release/IasisOS.uf2"

[tasks."software:fmt-check"]
run = "cargo fmt --all -- --check"

[tasks."software:lint"]
description = "Lint host and firmware sources"
depends = ["host:lint", "firmware:lint"]

[tasks."host:lint"]
run = "cargo clippy --locked --all-targets -- -D warnings"

[tasks."firmware:lint"]
run = "cargo clippy --locked --release -p iasis-firmware --target thumbv8m.main-none-eabihf -- -D warnings"

[tasks."software:test"]
description = "Test host, firmware logic and the wire protocol"
depends = ["host:test", "firmware:test"]

[tasks."host:test"]
description = "Test host software and the wire protocol"
run = "cargo test --locked"

[tasks."firmware:test"]
description = "Test the firmware logic"
run = "cargo test --locked -p iasis-firmware --lib"

[task_templates."pcb:step"]
description = "Export the populated board STEP"
vars = { args = "" }
sources = [
  "*.3dshapes/*",
  "*.kicad_pcb",
  "*.kicad_pro",
  "../../shared/Iasis.3dshapes/*",
  "../../../.mise/config.toml",
  "../../../pyproject.toml",
  "../../../uv.lock",
  "../../tools/board.py",
  ".mise.toml",
]
outputs = ["../../../build/boards/{{ config_root | basename }}/board.step"]
run = 'uv run --locked python "{{ config_root }}/../../tools/board.py" {{ vars.args }}'

[task_templates."pcb:fab"]
description = "Export JLCPCB fabrication and assembly files"
vars = { args = "" }
run = 'uv run --locked python "{{ config_root }}/../../tools/fab.py" {{ vars.args }}'

[task_templates."pcb:preview"]
description = "Render the board photo"
vars = { args = "" }
sources = [
  "*.3dshapes/*",
  "*.kicad_pcb",
  "*.kicad_pro",
  "../../shared/Iasis.3dshapes/*",
  "../../../.mise/config.toml",
  "../../../pyproject.toml",
  "../../../uv.lock",
  "../../tools/board.py",
  "../../tools/preview.py",
  ".mise.toml",
]
outputs = ["board.png"]
run = 'uv run --locked python "{{ config_root }}/../../tools/preview.py" {{ vars.args }}'

[task_templates."pcb:lint"]
description = "Run DRC, schematic parity and ERC"
run = 'uv run --locked python "{{ config_root }}/../../tools/board.py" --check'

[task_templates."project:format"]
description = "Format mise configuration"
run = "mise fmt"

[task_templates."project:fmt-check"]
description = "Check mise formatting"
run = "mise fmt --check"
