monorepo_root = true

[tools]
python = "3.14.7"
uv = "0.12.20"
ruff = "0.17.1"
resvg = "0.48.1"
oxipng = "10.2.1"
lefthook = "2.2.2"
oxfmt = "0.74.0"
node = "26.12.1"
"npm:pyright" = "1.1.414"

[settings]
experimental = true
pin = true
lockfile = true

[env]
KICAD_CLI = "/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli"
KICAD_PYTHON = "/Applications/KiCad/KiCad.app/Contents/Frameworks/Python.framework/Versions/Current/bin/python3"

[monorepo]
config_roots = ["hardware/case", "hardware/boards/*"]

[hooks]
postinstall = "lefthook install"

[tasks.deps]
description = "Install the CAD and viewer dependencies"
depends = ["//hardware/case:deps"]

[tasks.build]
description = "Build the case and each board's fabrication files"
depends = ["//hardware/case:build", "//hardware/boards/...:fab"]

[tasks.preview]
description = "Refresh the case and board previews"
depends = ["//hardware/case:preview", "//hardware/boards/...:preview"]

[tasks.check]
description = "Check sources, enclosure fit and KiCad designs"
depends = [
  "lint",
  "typecheck",
  "fmt-check",
  "test",
  "//hardware/case:check",
  "//hardware/boards/...:check",
]

[tasks.lint]
description = "Lint Python sources"
run = "ruff check hardware"

[tasks.typecheck]
description = "Check Python types in the case and KiCad environments"
run = [
  'uv run --locked --project hardware/case pyright --pythonpath hardware/case/.venv/bin/python --pythonversion 3.14 hardware/case/src',
  'pyright --pythonpath "$KICAD_PYTHON" --pythonversion 3.9 hardware/tools',
]

[tasks.test]
description = "Test JLCPCB placement conversion"
run = '"$KICAD_PYTHON" -m unittest discover -s hardware/tools -p "test_*.py"'

[tasks.format]
description = "Format Python, Markdown and configuration"
depends = ["//hardware/case:format", "//hardware/boards/...:format"]
run = ["mise fmt", "ruff format hardware", "oxfmt"]

[tasks.fmt-check]
description = "Check repository formatting"
depends = ["//hardware/case:fmt-check", "//hardware/boards/...:fmt-check"]
run = ["mise fmt --check", "ruff format --check hardware", "oxfmt --check"]

[task_templates."pcb:step"]
description = "Export the populated board STEP"
vars = { args = "" }
sources = [
  "*.3dshapes/*",
  "*.kicad_pcb",
  "*.kicad_pro",
  "../../shared/Iasis.3dshapes/*",
  "../../../.mise/config.toml",
  "../../tools/board.py",
  ".mise.toml",
]
outputs = ["../../../build/boards/{{ config_root | basename }}/board.step"]
run = '"$KICAD_PYTHON" "$MISE_MONOREPO_ROOT/hardware/tools/board.py" {{ vars.args }}'

[task_templates."pcb:fab"]
description = "Export JLCPCB fabrication and assembly files"
vars = { args = "" }
run = '"$KICAD_PYTHON" "$MISE_MONOREPO_ROOT/hardware/tools/fab.py" {{ vars.args }}'

[task_templates."pcb:preview"]
description = "Render the board and plot its copper layout"
vars = { args = "" }
sources = [
  "*.3dshapes/*",
  "*.kicad_pcb",
  "*.kicad_pro",
  "../../shared/Iasis.3dshapes/*",
  "../../../.mise/config.toml",
  "../../tools/board.py",
  "../../tools/preview.py",
  ".mise.toml",
]
outputs = ["preview/board.png", "preview/layout.png"]
run = '"$KICAD_PYTHON" "$MISE_MONOREPO_ROOT/hardware/tools/preview.py" {{ vars.args }}'

[task_templates."pcb:check"]
description = "Run DRC, schematic parity and ERC"
run = '"$KICAD_PYTHON" "$MISE_MONOREPO_ROOT/hardware/tools/board.py" --check'

[task_templates."project:format"]
description = "Format mise configuration"
run = "mise fmt"

[task_templates."project:fmt-check"]
description = "Check mise formatting"
run = "mise fmt --check"
